name: Build Vijendar Verma Portfolio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub Repository
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Check ZIP
      # --------------------------------------------------
      - name: Check Android ZIP
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f "AndroidApp.zip" ]; then
            echo "ERROR: AndroidApp.zip not found!"
            exit 1
          fi

          echo "AndroidApp.zip found successfully."

      # --------------------------------------------------
      # 3. Extract Android Project
      # --------------------------------------------------
      - name: Extract Android Project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o AndroidApp.zip -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 4 -type f | sort

      # --------------------------------------------------
      # 4. Detect Android Project Directory
      # --------------------------------------------------
      - name: Detect Android Project
        id: detect
        shell: bash
        run: |
          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found!"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 5. Verify Android Project
      # --------------------------------------------------
      - name: Verify Android Project
        run: |
          echo "Project directory:"
          echo "${{ steps.detect.outputs.project_dir }}"

          ls -lah "${{ steps.detect.outputs.project_dir }}"

          if [ ! -f "${{ steps.detect.outputs.project_dir }}/settings.gradle" ] && \
             [ ! -f "${{ steps.detect.outputs.project_dir }}/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing!"
            exit 1
          fi

          if [ ! -f "${{ steps.detect.outputs.project_dir }}/build.gradle" ] && \
             [ ! -f "${{ steps.detect.outputs.project_dir }}/build.gradle.kts" ]; then
            echo "ERROR: Root Gradle build file missing!"
            exit 1
          fi

          if [ ! -d "${{ steps.detect.outputs.project_dir }}/app" ]; then
            echo "ERROR: app directory missing!"
            exit 1
          fi

          echo "Android project verification successful."

      # --------------------------------------------------
      # 6. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 7. Setup Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 8. Install Android SDK Components
      # --------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 9. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      # --------------------------------------------------
      # 10. Check Important App Files
      # --------------------------------------------------
      - name: Check App Files
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking MainActivity..."
          find app/src/main/java -type f -maxdepth 10

          echo ""
          echo "Checking Android resources..."
          find app/src/main/res -maxdepth 3 -type f | sort

          echo ""
          echo "Checking Manifest..."
          cat app/src/main/AndroidManifest.xml

      # --------------------------------------------------
      # 11. Build APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          echo "Starting Gradle build..."

          gradle clean

          gradle assembleDebug \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 12. Find Generated APK
      # --------------------------------------------------
      - name: Find APK
        id: apk
        shell: bash
        run: |
          echo "Searching for APK..."

          find android-project \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find android-project \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 13. Rename APK
      # --------------------------------------------------
      - name: Prepare Final APK
        shell: bash
        run: |
          mkdir -p final-apk

          cp "${{ steps.apk.outputs.apk_file }}" \
             "final-apk/Vijendar-Verma-Portfolio.apk"

          ls -lh final-apk/Vijendar-Verma-Portfolio.apk

      # --------------------------------------------------
      # 14. Upload APK Artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vijendar-Verma-Portfolio-APK
          path: final-apk/Vijendar-Verma-Portfolio.apk
          if-no-files-found: error
          retention-days: 30
